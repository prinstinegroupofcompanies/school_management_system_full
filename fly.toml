# Fly.io configuration for School Management System
app = "school-management-system"
primary_region = "iad"  # Washington DC - good for US East Coast

[build]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_LEVEL = "error"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/database/school_management.sqlite"
  CACHE_DRIVER = "file"
  SESSION_DRIVER = "file"
  QUEUE_CONNECTION = "sync"
  BROADCAST_DRIVER = "log"
  FILESYSTEM_DISK = "local"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "data"
  destination = "/database"

[[statics]]
  guest_path = "/var/www/public"
  url_prefix = "/"
